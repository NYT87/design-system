<button class="ds-btn ds-btn--primary ds-btn--md" type="button" data-ds-modal-open="settings-dialog">Open settings</button>

<dialog class="ds-modal ds-modal--md" id="settings-dialog" aria-labelledby="settings-title">
  <div class="ds-modal__panel">
    <h2 class="ds-modal__title" id="settings-title">Settings</h2>
    <div class="ds-modal__body">
      <div class="ds-field">
        <label class="ds-field__label" for="m-name">Display name</label>
        <input class="ds-control" id="m-name" value="Ada">
      </div>
    </div>
    <div class="ds-modal__foot">
      <button class="ds-btn ds-btn--ghost ds-btn--md" type="button" data-ds-modal-close>Cancel</button>
      <button class="ds-btn ds-btn--primary ds-btn--md" type="button" data-ds-modal-close>Save</button>
    </div>
  </div>
</dialog>
