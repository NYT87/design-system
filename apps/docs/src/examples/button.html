<div class="stack">
  <div class="row">
    <button class="ds-btn ds-btn--primary ds-btn--md" type="button">Primary</button>
    <button class="ds-btn ds-btn--secondary ds-btn--md" type="button">Secondary</button>
    <button class="ds-btn ds-btn--ghost ds-btn--md" type="button">Ghost</button>
    <button class="ds-btn ds-btn--danger ds-btn--md" type="button">Delete</button>
  </div>
  <div class="row">
    <button class="ds-btn ds-btn--primary ds-btn--sm" type="button">Small</button>
    <button class="ds-btn ds-btn--primary ds-btn--md" type="button">Medium</button>
    <button class="ds-btn ds-btn--primary ds-btn--lg" type="button">Large (touch)</button>
  </div>
  <div class="row">
    <button class="ds-btn ds-btn--primary ds-btn--md" type="button" disabled aria-busy="true"><span class="ds-spinner" aria-hidden="true"></span>Saving</button>
    <button class="ds-btn ds-btn--primary ds-btn--md" type="button" disabled>Disabled</button>
    <button class="ds-btn ds-btn--primary ds-btn--md" type="button"><svg class="ds-icon" aria-hidden="true"><use href="#plus"/></svg>With icon</button>
    <button class="ds-btn ds-btn--ghost ds-btn--icon-only ds-btn--md" type="button" aria-label="Settings" title="Settings"><svg class="ds-icon" aria-hidden="true"><use href="#settings"/></svg></button>
    <a class="ds-btn ds-btn--secondary ds-btn--md" href="#/button">A link that looks like a button</a>
  </div>
</div>
