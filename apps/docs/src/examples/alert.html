<div class="stack">
  <div class="ds-alert ds-alert--info" role="status">
    <div class="ds-alert__main"><p class="ds-alert__title">Heads up</p><div class="ds-alert__body">Imports run in the background; you can leave this page.</div></div>
  </div>
  <div class="ds-alert ds-alert--ok" role="status">
    <div class="ds-alert__main"><p class="ds-alert__title">Saved</p><div class="ds-alert__body">Your changes are live.</div></div>
  </div>
  <div class="ds-alert ds-alert--warn" role="alert">
    <div class="ds-alert__main"><p class="ds-alert__title">Credential expires in 3 days</p><div class="ds-alert__body">Reconnect to avoid interruption.</div></div>
  </div>
  <div class="ds-alert ds-alert--danger" role="alert">
    <div class="ds-alert__main"><p class="ds-alert__title">Could not parse the file</p><div class="ds-alert__body">Line 42: unexpected end of input.</div></div>
    <div class="ds-alert__action"><button class="ds-btn ds-btn--secondary ds-btn--sm" type="button">Try again</button></div>
  </div>
</div>
