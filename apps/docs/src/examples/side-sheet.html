<button class="ds-btn ds-btn--primary ds-btn--md" type="button" data-ds-modal-open="run-sheet">View run details</button>

<dialog class="ds-modal ds-sheet" id="run-sheet" aria-labelledby="run-sheet-title">
  <div class="ds-modal__panel">
    <div class="ds-sheet__head">
      <h2 class="ds-modal__title" id="run-sheet-title">Run #1204</h2>
      <button class="ds-btn ds-btn--ghost ds-btn--icon-only ds-btn--md" type="button" data-ds-modal-close aria-label="Close"><svg class="ds-icon" aria-hidden="true"><use href="#x"/></svg></button>
    </div>
    <div class="ds-modal__body">
      <p>Started 12:04, finished in 3.2 s.</p>
    </div>
    <div class="ds-modal__foot">
      <button class="ds-btn ds-btn--ghost ds-btn--md" type="button" data-ds-modal-close>Close</button>
      <button class="ds-btn ds-btn--primary ds-btn--md" type="button">Retry</button>
    </div>
  </div>
</dialog>
