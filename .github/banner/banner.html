<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nyt87 design system banner</title>
<!-- Source of the README banner. Rendered to banner-light.png and banner-dark.png by render.mjs, using the real tokens and components. -->
<link rel="stylesheet" href="../../packages/tokens/dist/tokens.css">
<link rel="stylesheet" href="../../packages/ui/src/styles.css">
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Manrope'; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1280px; height: 360px; overflow: hidden; background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--font-sans); }
  .banner { position: relative; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 440px; gap: 56px; align-items: center; padding: 0 64px; }
  /* a thin accent rule along the bottom edge, the studio's one orange */
  .banner::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--accent); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .brand img { display: block; }
  .brand .icon { height: 36px; width: 36px; }
  .brand .text { height: 28px; width: auto; }
  .brand .dark { display: none; }
  :root[data-theme='dark'] .brand .light { display: none; }
  :root[data-theme='dark'] .brand .dark { display: block; }
  h1 { margin: 0 0 14px; font: 500 68px/1.02 var(--font-heading); letter-spacing: -0.04em; }
  .lead { margin: 0 0 26px; font-size: 21px; line-height: 1.5; color: var(--fg-muted); max-width: 30em; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chips .ds-badge { font: 500 13px/1.5 var(--font-mono); letter-spacing: 0.02em; padding: 0.25em 0.9em; }
  .sample { transform: rotate(0deg); box-shadow: var(--shadow-md); }
  .sample .ds-card__body { display: grid; gap: 18px; }
  .sample .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sample .ds-field { gap: 4px; }
</style>
</head>
<body>
  <div class="banner">
    <div>
      <div class="brand">
        <img class="icon" src="../../apps/docs/public/brand/logo-icon.png" alt="">
        <img class="text light" src="../../apps/docs/public/brand/logo-text.png" alt="">
        <img class="text dark" src="../../apps/docs/public/brand/logo-text-white.png" alt="">
      </div>
      <h1>Design system</h1>
      <p class="lead">Design tokens and framework-free components for every nyt87 product: plain HTML and CSS, tested for contrast.</p>
      <div class="chips">
        <span class="ds-badge ds-badge--accent"><span class="ds-badge__dot"></span>HTML + CSS</span>
        <span class="ds-badge"><span class="ds-badge__dot"></span>0.3 to 0.6 KB scripts</span>
        <span class="ds-badge"><span class="ds-badge__dot"></span>Light and dark</span>
        <span class="ds-badge"><span class="ds-badge__dot"></span>WCAG tested</span>
      </div>
    </div>
    <section class="ds-card sample" aria-hidden="true">
      <header class="ds-card__head"><h3 class="ds-card__title">Connected accounts</h3><span class="ds-badge ds-badge--ok"><span class="ds-badge__dot"></span>Live</span></header>
      <div class="ds-card__body">
        <div class="ds-field"><label class="ds-field__label">Display name</label><input class="ds-control" value="Ada Lovelace" readonly tabindex="-1"></div>
        <label class="ds-choice"><input type="checkbox" role="switch" class="ds-switch" checked tabindex="-1"><span class="ds-choice__text">Background sync</span></label>
        <div class="row"><button class="ds-btn ds-btn--primary ds-btn--md" tabindex="-1">Save changes</button><button class="ds-btn ds-btn--secondary ds-btn--md" tabindex="-1">Cancel</button></div>
      </div>
    </section>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  </script>
</body>
</html>
