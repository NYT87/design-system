name: Release

# Release Please keeps ONE release PR open on main, listing the changes to @nyt87/tokens, @nyt87/icons and @nyt87/ui since their last release.
# Merging that PR creates the tags (tokens-vX.Y.Z, ui-vX.Y.Z) and GitHub releases, and this workflow then publishes exactly the
# packages that were released to GitHub Packages. Nothing is published on any other push.
#
# Commits must follow Conventional Commits, because they decide the next version (0.x: fix = patch, feat = minor, "!" = minor):
#   feat(ui): add Tooltip      fix(tokens): darken warn text      feat(ui)!: rename Button prop
# docs:, chore:, ci:, test:, refactor: commits do not cause a release.
#
# The same versions are also published to npmjs.org, where anyone can install them without a token. This uses npm trusted
# publishing: each package on npmjs.com lists this repository and this workflow file (release.yml) as a trusted publisher, and
# the job proves its identity with a short-lived OIDC token, so no npm secret is stored. If a repository secret NPM_TOKEN
# exists it is used instead (only needed to bootstrap a package that does not exist on npmjs.org yet). A failure here does
# not fail the release: GitHub Packages stays the source of truth and npmjs.org is the public mirror.
#
# A manual run (Actions > Release > Run workflow) publishes the versions currently in package.json that are not on the registry
# yet: for the very first release, or to retry a failed publish. Versions already published are skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Which packages to publish
        type: choice
        options: [all, tokens, icons, ui]
        default: all

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tokens_created: ${{ steps.rp.outputs['packages/tokens--release_created'] }}
      icons_created: ${{ steps.rp.outputs['packages/icons--release_created'] }}
      ui_created: ${{ steps.rp.outputs['packages/ui--release_created'] }}
    steps:
      # Pinned to the commit SHA of v5.0.0 (same pin as the magomap repo).
      - name: Create or update the release PR, and create releases for merged ones
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # PRs opened with GITHUB_TOKEN do not trigger workflows, so CI is dispatched on the release PR's branch.
  verify-release-pr:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.release-please.outputs.tokens_created != 'true' && needs.release-please.outputs.icons_created != 'true' && needs.release-please.outputs.ui_created != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch CI for the open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == "'"${GITHUB_REPOSITORY}"'" and (.head.ref | test("^release-please--branches--main")))][0].head.ref // empty')"
          if [ -z "$branch" ]; then echo 'No open release PR to verify.'; exit 0; fi
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "$branch"
          echo "Dispatched CI on $branch."

  publish:
    needs: release-please
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.tokens_created == 'true' ||
        needs.release-please.outputs.icons_created == 'true' ||
        needs.release-please.outputs.ui_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # npm trusted publishing (OIDC) to npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nyt87'
      - run: npm ci
      - run: npm run build:packages
      - run: npm test
      - run: npm run typecheck
      - run: npm run build -w @nyt87/ui
      - name: Publish what was released, tokens and icons first (ui depends on tokens)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          TOKENS_CREATED: ${{ needs.release-please.outputs.tokens_created }}
          ICONS_CREATED: ${{ needs.release-please.outputs.icons_created }}
          UI_CREATED: ${{ needs.release-please.outputs.ui_created }}
        run: |
          set -euo pipefail
          want=""
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_PACKAGES" in tokens) want="tokens" ;; icons) want="icons" ;; ui) want="ui" ;; *) want="tokens icons ui" ;; esac
          else
            [ "$TOKENS_CREATED" = true ] && want="tokens"
            [ "$ICONS_CREATED" = true ] && want="$want icons"
            [ "$UI_CREATED" = true ] && want="$want ui"
          fi
          echo "Candidates: ${want:-none}"
          for p in $want; do
            name="@nyt87/$p"
            version="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping."
            else
              echo "Publishing $name@$version"
              npm publish -w "$name"
            fi
          done
      - name: Also publish to npmjs.org (trusted publishing; failures do not fail the release)
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          TOKENS_CREATED: ${{ needs.release-please.outputs.tokens_created }}
          ICONS_CREATED: ${{ needs.release-please.outputs.icons_created }}
          UI_CREATED: ${{ needs.release-please.outputs.ui_created }}
        run: |
          set -euo pipefail
          npm --version
          want=""
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_PACKAGES" in tokens) want="tokens" ;; icons) want="icons" ;; ui) want="ui" ;; *) want="tokens icons ui" ;; esac
          else
            [ "$TOKENS_CREATED" = true ] && want="tokens"
            [ "$ICONS_CREATED" = true ] && want="$want icons"
            [ "$UI_CREATED" = true ] && want="$want ui"
          fi
          # The scope override beats each package's publishConfig (GitHub Packages). Without a token npm (11.5.1 or later)
          # exchanges the job's OIDC identity for a publish credential and adds provenance; with NPM_TOKEN it uses the token.
          npmjs=(--@nyt87:registry=https://registry.npmjs.org/ --access public)
          if [ -n "$NPM_TOKEN" ]; then npmjs+=(--//registry.npmjs.org/:_authToken="$NPM_TOKEN"); fi
          for p in $want; do
            name="@nyt87/$p"
            version="$(node -p "require('./packages/$p/package.json').version")"
            if npm view "$name@$version" version "${npmjs[@]}" >/dev/null 2>&1; then
              echo "$name@$version is already on npmjs.org, skipping."
            else
              echo "Publishing $name@$version to npmjs.org"
              npm publish -w "$name" "${npmjs[@]}"
            fi
          done
