name: Publish packages

# Publishes @nyt87/tokens and @nyt87/ui to GitHub Packages when a version tag is pushed:
#   npm version <x.y.z> -ws --no-git-tag-version && git commit -am "release x.y.z" && git tag vX.Y.Z && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nyt87'
      - run: npm ci
      - name: Tag must match both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in tokens ui; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v but the tag is v$tag"; exit 1; }
          done
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:tokens
      - run: npm run build -w @nyt87/ui
      - name: Publish tokens, then ui (ui depends on tokens)
        run: |
          npm publish -w @nyt87/tokens
          npm publish -w @nyt87/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
